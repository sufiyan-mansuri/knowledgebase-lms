{% extends "base.html" %}

{% block content %}

<section class="py-5">
  <div class="container">

    <div class="row justify-content-center">
      <div class="col-xl-6 col-lg-8">

        <div class="card p-5 text-center">

          <div class="mb-3 fs-1 text-danger">⚠️</div>

          <h3 class="fw-semibold mb-2">Delete Question</h3>

          <p class="text-muted mb-3">
            Are you sure you want to permanently delete this question?
          </p>

          <div class="alert alert-light border mb-4 text-start">
            <strong>Question:</strong><br>
            {{ object.question }}
          </div>

          <p class="small text-muted mb-4">
            This will remove all related options and affect quiz scoring.
          </p>

          <form method="post">
            {% csrf_token %}

            <div class="d-flex justify-content-center gap-3">

              <a href="{% url 'quizzes:quiz_detail' object.quiz.lesson.module.course.slug object.quiz.lesson.module.id object.quiz.lesson.id %}"
                 class="btn btn-outline-secondary px-4">
                Cancel
              </a>

              <button type="submit" class="btn btn-danger px-4">
                Yes, Delete Question
              </button>

            </div>

          </form>

        </div>

      </div>
    </div>

  </div>
</section>

{% endblock content %}
