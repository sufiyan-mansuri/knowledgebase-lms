{% extends "base.html" %}

{% block content %}

<section class="py-5">
  <div class="container">

    <div class="row justify-content-center">
      <div class="col-xl-6 col-lg-8">

        <div class="card p-5 text-center">

          <div class="mb-3 fs-1 text-danger">⚠️</div>

          <h3 class="fw-semibold mb-2">Delete Course</h3>

          <p class="text-muted mb-4">
            Are you sure you want to permanently delete  
            <strong>{{ object.title }}</strong>?
          </p>

          <p class="small text-muted mb-4">
            This action cannot be undone. All modules, lessons, quizzes and progress
            related to this course will be removed.
          </p>

          <form method="post">
            {% csrf_token %}

            <div class="d-flex justify-content-center gap-3">
              <a href="{% url 'instructor_dashboard' %}" class="btn btn-outline-secondary px-4">
                Cancel
              </a>

              <button type="submit" class="btn btn-danger px-4">
                Yes, Delete Course
              </button>
            </div>

          </form>

        </div>

      </div>
    </div>
  </div>
</section>

{% endblock content %}
