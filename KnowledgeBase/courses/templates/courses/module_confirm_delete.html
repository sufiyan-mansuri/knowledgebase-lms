{% extends "base.html" %}

{% block content %}

<section class="py-5">
  <div class="container">

    <div class="row justify-content-center">
      <div class="col-xl-6 col-lg-8">

        <div class="card p-5 text-center">

          <div class="mb-3 fs-1 text-danger">⚠️</div>

          <h3 class="fw-semibold mb-2">Delete Module</h3>

          <p class="text-muted mb-3">
            Are you sure you want to permanently delete  
            <strong>{{ object.title }}</strong>?
          </p>

          <p class="small text-muted mb-4">
            This will also delete all lessons and quizzes associated with this module.
          </p>

          <form method="post">
            {% csrf_token %}

            <div class="d-flex justify-content-center gap-3">

              <a href="{% url 'courses:module_list' object.course.slug %}"
                 class="btn btn-outline-secondary px-4">
                Cancel
              </a>

              <button type="submit" class="btn btn-danger px-4">
                Yes, Delete Module
              </button>

            </div>

          </form>

        </div>

      </div>
    </div>

  </div>
</section>

{% endblock content %}
